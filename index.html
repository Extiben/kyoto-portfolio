
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@200;300&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: #fdf6f0;
    font-family: 'Jost', sans-serif;
    overflow-x: hidden;
  }

  .page {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 3rem 1.5rem;
    position: relative;
    background: linear-gradient(160deg, #fdf6f0 0%, #fce8e8 40%, #f9e0e8 100%);
  }

  /* Flores decorativas SVG - esquinas */
  .flor-svg {
    position: absolute;
    pointer-events: none;
  }
  .flor-tl { top: -10px; left: -10px; width: 220px; opacity: 0.75; transform: rotate(0deg); }
  .flor-tr { top: -10px; right: -10px; width: 200px; opacity: 0.65; transform: scaleX(-1); }
  .flor-bl { bottom: -10px; left: -10px; width: 190px; opacity: 0.6; transform: scaleY(-1); }
  .flor-br { bottom: -10px; right: -10px; width: 210px; opacity: 0.7; transform: scale(-1,-1); }

  /* Pétalos flotantes */
  .petal {
    position: absolute;
    width: 10px; height: 14px;
    background: #f4a7b9;
    border-radius: 50% 0 50% 0;
    opacity: 0;
    animation: fall linear infinite;
  }
  @keyframes fall {
    0%   { opacity: 0; transform: translateY(-20px) rotate(0deg); }
    10%  { opacity: 0.7; }
    90%  { opacity: 0.5; }
    100% { opacity: 0; transform: translateY(110vh) rotate(360deg) translateX(40px); }
  }

  /* Marco de la foto */
  .photo-frame {
    position: relative;
    width: 240px; height: 240px;
    margin-bottom: 2.2rem;
    animation: fadeUp 1.2s ease both;
  }
  .photo-frame::before {
    content: '';
    position: absolute;
    inset: -8px;
    border: 1.5px solid #e8a4b8;
    border-radius: 50%;
    animation: spin 20s linear infinite;
    background: conic-gradient(transparent 0deg, #f9ccd8 60deg, transparent 120deg, #f9ccd8 200deg, transparent 280deg, #f9ccd8 340deg, transparent 360deg);
    opacity: 0.6;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .photo-inner {
    width: 100%; height: 100%;
    border-radius: 50%;
    overflow: hidden;
    border: 3px solid #fff;
    box-shadow: 0 8px 40px rgba(220,130,160,0.25);
    background: #fce4ec;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column;
    gap: 6px;
  }

  .placeholder-icon {
    font-size: 48px;
    opacity: 0.5;
  }
  .placeholder-text {
    font-family: 'Jost', sans-serif;
    font-weight: 200;
    font-size: 11px;
    color: #c08090;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  /* Texto principal */
  .content {
    text-align: center;
    max-width: 480px;
    animation: fadeUp 1.4s ease 0.2s both;
  }

  .eyebrow {
    font-family: 'Jost', sans-serif;
    font-weight: 200;
    font-size: 11px;
    letter-spacing: 0.25em;
    color: #c08890;
    text-transform: uppercase;
    margin-bottom: 0.9rem;
  }

  .main-title {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-size: 3rem;
    line-height: 1.15;
    color: #6b2f45;
    margin-bottom: 1.4rem;
    font-style: italic;
  }

  .divider {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-bottom: 1.4rem;
  }
  .divider-line {
    width: 60px; height: 0.5px;
    background: linear-gradient(to right, transparent, #e8a4b8);
  }
  .divider-line.right {
    background: linear-gradient(to left, transparent, #e8a4b8);
  }
  .divider-dot {
    width: 6px; height: 6px;
    background: #e8a4b8;
    border-radius: 50%;
  }

  .message {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-size: 1.15rem;
    line-height: 1.9;
    color: #8b4a5c;
    font-style: italic;
    margin-bottom: 2rem;
  }

  .names {
    font-family: 'Jost', sans-serif;
    font-weight: 200;
    font-size: 12px;
    letter-spacing: 0.3em;
    color: #c08890;
    text-transform: uppercase;
  }

  .heart {
    display: inline-block;
    color: #e8a4b8;
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.2); }
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Pequeñas florecitas dispersas */
  .mini-flower {
    position: absolute;
    font-size: 16px;
    opacity: 0.35;
    animation: sway 6s ease-in-out infinite;
  }
  @keyframes sway {
    0%, 100% { transform: rotate(-8deg) scale(1); }
    50%       { transform: rotate(8deg) scale(1.08); }
  }
</style>

<script>
  const page = document.getElementById('page');
  for (let i = 0; i < 14; i++) {
    const p = document.createElement('div');
    p.className = 'petal';
    const hue = Math.random() > 0.5 ? '#f4a7b9' : '#fce4ec';
    p.style.cssText = `
      left: ${Math.random()*100}%;
      top: ${Math.random()*10}%;
      width: ${8 + Math.random()*8}px;
      height: ${10 + Math.random()*10}px;
      background: ${hue};
      border-radius: ${Math.random() > 0.5 ? '50% 0 50% 0' : '0 50% 0 50%'};
      animation-duration: ${6 + Math.random()*8}s;
      animation-delay: ${Math.random()*8}s;
    `;
    page.appendChild(p);
  }
</script>
